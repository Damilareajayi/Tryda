<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#1A7A8A"/>
    </linearGradient>
    <linearGradient id="mBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2AAFBD"/>
      <stop offset="100%" stop-color="#0F4F6A"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="800" height="500" fill="#0A1628" rx="12"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="500" fill="#0F1F38" rx="12 0 0 12"/>
  <rect x="200" y="0" width="1" height="500" fill="#1F2D40"/>

  <!-- Sidebar logo area -->
  <rect x="0" y="0" width="200" height="72" fill="#0F1F38"/>
  <line x1="0" y1="72" x2="200" y2="72" stroke="#1F2D40" stroke-width="1"/>

  <!-- Gem mark in sidebar (small) -->
  <polygon points="28,18 42,28 14,28" fill="url(#mTop)"/>
  <polygon points="14,28 28,18 21,28" fill="#1A7A8A" opacity="0.85"/>
  <polygon points="28,18 42,28 35,28" fill="#4ECDC4" opacity="0.75"/>
  <polygon points="12,31 44,31 28,58" fill="url(#mBody)"/>
  <polygon points="12,31 28,58 20,31" fill="#145374" opacity="0.85"/>
  <polygon points="44,31 28,58 36,31" fill="#3DBDBD" opacity="0.6"/>
  <rect x="18" y="21" width="20" height="4" rx="1" fill="white" opacity="0.95"/>
  <rect x="21" y="21" width="5" height="10" rx="1" fill="white" opacity="0.95"/>
  <rect x="30" y="21" width="5" height="10" rx="1" fill="white" opacity="0.95"/>

  <!-- Tryda brand name in sidebar -->
  <text x="53" y="43"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="18" font-weight="700" letter-spacing="0.5"
    fill="white">Tryda</text>
  <text x="53" y="57"
    font-family="Arial, sans-serif"
    font-size="9" fill="#4ECDC4" letter-spacing="0.5" opacity="0.8">AI Reliability Monitor</text>

  <!-- Nav items -->
  <rect x="12" y="86" width="176" height="32" rx="6" fill="#00D4B4" opacity="0.15"/>
  <rect x="20" y="96" width="12" height="12" rx="2" fill="#00D4B4" opacity="0.7"/>
  <text x="40" y="106" font-family="Arial" font-size="12" fill="#00D4B4" font-weight="600">Dashboard</text>

  <rect x="20" y="134" width="12" height="12" rx="2" fill="#6B7280" opacity="0.5"/>
  <text x="40" y="144" font-family="Arial" font-size="12" fill="#6B7280">Drift Events</text>

  <rect x="20" y="162" width="12" height="12" rx="2" fill="#6B7280" opacity="0.5"/>
  <text x="40" y="172" font-family="Arial" font-size="12" fill="#6B7280">Recommendations</text>

  <rect x="20" y="190" width="12" height="12" rx="2" fill="#6B7280" opacity="0.5"/>
  <text x="40" y="200" font-family="Arial" font-size="12" fill="#6B7280">Report</text>

  <!-- Divider in nav -->
  <line x1="12" y1="228" x2="188" y2="228" stroke="#1F2D40" stroke-width="1"/>
  <text x="20" y="248" font-family="Arial" font-size="9" fill="#4B5563" letter-spacing="1.5">SETUP</text>
  <rect x="20" y="258" width="12" height="12" rx="2" fill="#6B7280" opacity="0.5"/>
  <text x="40" y="268" font-family="Arial" font-size="12" fill="#6B7280">Connect AI Tool</text>
  <rect x="20" y="286" width="12" height="12" rx="2" fill="#6B7280" opacity="0.5"/>
  <text x="40" y="296" font-family="Arial" font-size="12" fill="#6B7280">Settings</text>

  <!-- Main content area -->
  <!-- Header -->
  <text x="224" y="48" font-family="Arial" font-size="18" font-weight="700" fill="white">Dashboard</text>
  <text x="224" y="64" font-family="Arial" font-size="11" fill="#6B7280">Real-time AI reliability overview</text>
  <circle cx="760" cy="50" r="5" fill="#00D4B4" opacity="0.8"/>
  <text x="770" y="54" font-family="Arial" font-size="10" fill="#6B7280">Live</text>

  <!-- Health score card -->
  <rect x="220" y="84" width="140" height="160" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <!-- Ring -->
  <circle cx="290" cy="148" r="44" fill="none" stroke="#1F2D40" stroke-width="7"/>
  <circle cx="290" cy="148" r="44" fill="none" stroke="#F59E0B" stroke-width="7"
    stroke-dasharray="276.5" stroke-dashoffset="96"
    stroke-linecap="round" transform="rotate(-90 290 148)"/>
  <text x="290" y="144" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#F59E0B">74</text>
  <text x="290" y="158" text-anchor="middle" font-family="Arial" font-size="9" fill="#6B7280">/ 100</text>
  <text x="290" y="225" text-anchor="middle" font-family="Arial" font-size="11" font-weight="600" fill="#F59E0B">Warning</text>
  <text x="290" y="240" text-anchor="middle" font-family="Arial" font-size="9" fill="#6B7280">AI Quality Score</text>

  <!-- Stat cards -->
  <rect x="372" y="84" width="128" height="72" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="384" y="107" font-family="Arial" font-size="9" fill="#6B7280">CONVERSATIONS</text>
  <text x="384" y="135" font-family="Arial" font-size="24" font-weight="700" fill="white">1,284</text>
  <text x="384" y="149" font-family="Arial" font-size="9" fill="#6B7280">Last 7 days</text>

  <rect x="512" y="84" width="128" height="72" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="524" y="107" font-family="Arial" font-size="9" fill="#6B7280">OPEN DRIFT EVENTS</text>
  <text x="524" y="135" font-family="Arial" font-size="24" font-weight="700" fill="#EF4444">1</text>
  <text x="524" y="149" font-family="Arial" font-size="9" fill="#6B7280">2 resolved</text>

  <rect x="652" y="84" width="128" height="72" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="664" y="107" font-family="Arial" font-size="9" fill="#6B7280">PENDING FIXES</text>
  <text x="664" y="135" font-family="Arial" font-size="24" font-weight="700" fill="#F59E0B">3</text>
  <text x="664" y="149" font-family="Arial" font-size="9" fill="#6B7280">Recommendations</text>

  <rect x="372" y="168" width="128" height="76" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="512" y="168" font-family="Arial" font-size="9" fill="#6B7280"/>

  <!-- Quality chart area -->
  <rect x="220" y="256" width="560" height="110" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="234" y="276" font-family="Arial" font-size="11" font-weight="600" fill="#E5E7EB">Quality Score — 7 Day Trend</text>
  <text x="746" y="276" text-anchor="end" font-family="Arial" font-size="9" fill="#6B7280">Baseline: 87</text>
  <!-- Chart line (simplified) -->
  <polyline points="240,330 290,325 340,327 390,318 440,340 490,348 540,336"
    fill="none" stroke="#00D4B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="240,330 290,325 340,327 390,318 440,340 490,348 540,336 540,355 240,355"
    fill="#00D4B4" opacity="0.07"/>
  <line x1="240" y1="320" x2="540" y2="320" stroke="#374151" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Bottom drift/rec panels -->
  <rect x="220" y="378" width="270" height="110" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="234" y="398" font-family="Arial" font-size="9" fill="#6B7280" letter-spacing="1">RECENT DRIFT EVENTS</text>
  <rect x="234" y="408" width="242" height="36" rx="6" fill="#EF444410" stroke="#EF444430" stroke-width="1"/>
  <text x="246" y="424" font-family="Arial" font-size="10" fill="#EF4444">● critical</text>
  <text x="300" y="424" font-family="Arial" font-size="10" fill="#E5E7EB">Prompt Drift</text>
  <text x="440" y="424" text-anchor="end" font-family="Arial" font-size="9" fill="#6B7280">2d ago</text>
  <rect x="234" y="450" width="242" height="28" rx="6" fill="#1F2D40"/>
  <text x="246" y="468" font-family="Arial" font-size="10" fill="#6B7280">✓ Stale Knowledge Base</text>

  <rect x="502" y="378" width="278" height="110" rx="10" fill="#111827" stroke="#1F2D40" stroke-width="1"/>
  <text x="516" y="398" font-family="Arial" font-size="9" fill="#6B7280" letter-spacing="1">TOP RECOMMENDATIONS</text>
  <rect x="516" y="408" width="250" height="36" rx="6" fill="#EF444410" stroke="#EF444430" stroke-width="1"/>
  <text x="528" y="428" font-family="Arial" font-size="10" fill="#E5E7EB">Restore system prompt</text>
  <rect x="516" y="450" width="250" height="28" rx="6" fill="#F59E0B10" stroke="#F59E0B30" stroke-width="1"/>
  <text x="528" y="468" font-family="Arial" font-size="10" fill="#E5E7EB">Update product pricing</text>
</svg>
