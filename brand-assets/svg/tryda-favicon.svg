<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fgTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#1A7A8A"/>
    </linearGradient>
    <linearGradient id="fgBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2AAFBD"/>
      <stop offset="100%" stop-color="#0F4F6A"/>
    </linearGradient>
  </defs>
  <!-- Top bevel -->
  <polygon points="32,8 46,20 18,20" fill="url(#fgTop)"/>
  <!-- Left bevel -->
  <polygon points="18,20 32,8 25,20" fill="#1A7A8A" opacity="0.85"/>
  <!-- Right bevel -->
  <polygon points="32,8 46,20 39,20" fill="#4ECDC4" opacity="0.75"/>
  <!-- Body -->
  <polygon points="16,23 48,23 32,55" fill="url(#fgBody)"/>
  <!-- Left facet -->
  <polygon points="16,23 32,55 24,23" fill="#145374" opacity="0.85"/>
  <!-- Right facet -->
  <polygon points="48,23 32,55 40,23" fill="#3DBDBD" opacity="0.6"/>
  <!-- TT mark -->
  <rect x="22" y="10" width="20" height="4" rx="1" fill="white" opacity="0.95"/>
  <rect x="25" y="10" width="5" height="10" rx="1" fill="white" opacity="0.95"/>
  <rect x="34" y="10" width="5" height="10" rx="1" fill="white" opacity="0.95"/>
</svg>
